<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<title>Guardarropa</title>
<style>
:root{
  --base:#F5F2EB; --card:#EAE4D8; --paper:#FCFAF6;
  --navy:#1B3A5C; --ink:#23252A; --muted:#736F66; --line:#D8D1C2;
  --accent:#B08A5A;
  --serif:"Palatino Linotype","Book Antiqua","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--base); color:var(--ink); font-family:var(--sans)}
a{color:inherit; text-decoration:none}

header{background:var(--navy); color:#fff; padding:calc(13px + env(safe-area-inset-top)) 18px 0; flex:none}
.masthead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.bookbtn{background:none; border:0; padding:0; text-align:left; cursor:pointer; color:#fff; font:inherit; min-width:0}
.bookbtn .sub{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.55); white-space:nowrap}
.bookbtn h1{font-family:var(--serif); font-size:21px; font-weight:600; margin:1px 0 0; white-space:nowrap}
.bookbtn h1 .caret{font-size:11px; opacity:.6; margin-left:5px; vertical-align:2px}
.bookbtn .sub2{font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.72);
  margin-top:3px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hbtns{display:flex; gap:7px; flex:none}
.hbtn{background:none; border:1px solid rgba(255,255,255,.32); color:#fff; font:inherit;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:6px 10px;
  border-radius:999px; cursor:pointer; transition:.18s; white-space:nowrap; display:inline-block}
.hbtn:hover{background:rgba(255,255,255,.13)}
.hbtn[hidden]{display:none}

.sheet{position:fixed; inset:0; z-index:40; background:rgba(27,58,92,.55); display:none; align-items:flex-end; justify-content:center}
.sheet.open{display:flex}
.sheetbody{background:var(--base); width:100%; max-width:620px; max-height:88dvh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:26px 24px calc(30px + env(safe-area-inset-bottom))}
@media(min-width:700px){ .sheet{align-items:center} .sheetbody{border-radius:16px} }
.sheetbody h3{font-family:var(--serif); font-size:24px; margin:6px 0 4px; font-weight:600}
.kick{font-size:9.5px; letter-spacing:.19em; text-transform:uppercase; color:var(--muted); font-weight:600}
.blist{list-style:none; margin:10px 0 0; padding:0}
.brow{display:flex; gap:14px; align-items:center; width:100%; text-align:left; cursor:pointer;
  border-top:1px solid var(--line); padding:13px 0; font:inherit}
.brow .sw{display:flex; gap:3px; flex:none}
.brow .sw i{width:11px; height:11px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.13)}
.brow strong{display:block; font-family:var(--serif); font-size:17px; font-weight:600}
.brow small{display:block; font-size:11px; color:var(--muted); margin-top:2px}
.brow .go{margin-left:auto; color:var(--muted); font-size:16px}
.brow.cur strong{color:var(--wk,var(--accent))}
.dirlist{list-style:none; margin:16px 0 0; padding:0}
.dirlist li{display:flex; gap:14px; padding:12px 0; border-top:1px solid var(--line)}
.dirlist .num{font-family:var(--serif); font-size:15px; color:var(--wk,var(--accent)); width:22px; flex:none}
.dirlist strong{display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:4px}
.dirlist p{margin:0; font-size:14px; line-height:1.5; color:var(--muted)}
.pal{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.pal div{width:30px; height:30px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.snote{font-size:13px; line-height:1.5; color:var(--muted); margin:18px 0 0}
.closebtn{margin-top:24px; width:100%; padding:12px; border-radius:999px; cursor:pointer;
  background:var(--navy); color:#fff; border:0; font:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase}

:focus-visible{outline:2px solid var(--wk,var(--accent)); outline-offset:3px}
@media(prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}

body{min-height:100dvh}
header{position:sticky; top:0; z-index:20; padding-bottom:13px}
main{padding:18px 16px 40px; max-width:1180px; margin:0 auto}

.hero{display:flex; gap:16px; align-items:center; background:var(--card); border-radius:14px;
  padding:14px 16px; margin-bottom:26px}
.hero img{height:120px; width:auto; flex:none}
.hero .k{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700}
.hero h2{font-family:var(--serif); font-size:21px; margin:4px 0 0; font-weight:600; line-height:1.15}
.hero p{margin:5px 0 0; font-size:12.5px; color:var(--muted); line-height:1.45}
.hero .go{margin-left:auto; font-size:18px; color:var(--muted); flex:none}

.shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:30px}
@media(min-width:820px){ .shelf{grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px} }
.bcard{background:var(--card); border-radius:12px; padding:14px 14px 15px; display:flex; flex-direction:column; gap:9px;
  transition:transform .15s, box-shadow .15s}
.bcard:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(60,50,35,.14)}
.bcard .figs{display:flex; gap:2px; height:88px; align-items:flex-end; justify-content:center}
.bcard .figs img{height:88px; width:auto}
.bcard strong{font-family:var(--serif); font-size:16px; font-weight:600; line-height:1.15}
.bcard small{font-size:10.5px; color:var(--muted); line-height:1.35; display:block; margin-top:2px}
.bcard .sw{display:flex; gap:3px; margin-top:2px}
.bcard .sw i{width:9px; height:9px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.13)}

.seclabel{font-size:9.5px; letter-spacing:.19em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0 0 12px}
.facets{display:flex; flex-direction:column; gap:7px; margin-bottom:14px}
.facet{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
.facet::-webkit-scrollbar{display:none}
.fchip{background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer; font:inherit;
  padding:5px 11px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; transition:.15s}
.fchip.on{background:var(--navy); color:#fff; border-color:var(--navy)}
.galcount{font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:12px}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
@media(min-width:560px){ .grid{grid-template-columns:repeat(4,1fr)} }
@media(min-width:900px){ .grid{grid-template-columns:repeat(6,1fr); gap:14px} }
.cell{background:var(--card); border-radius:10px; padding:9px 6px 8px;
  display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; transition:transform .15s, box-shadow .15s}
.cell:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(60,50,35,.13)}
.cell img{height:96px; width:auto; max-width:100%; object-fit:contain}
@media(min-width:900px){ .cell img{height:126px} }
.cell .ct{font-size:10.5px; line-height:1.25; color:var(--ink)}
.cell .cd{font-size:8.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.more{margin:18px auto 4px; display:block; padding:11px 26px; border-radius:999px; cursor:pointer;
  background:none; border:1px solid var(--line); color:var(--muted); font:inherit;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600}
.more:hover{background:var(--card)}
.empty{padding:50px 0; text-align:center; color:var(--muted); font-size:14px}

.wx{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.wx b{font-family:var(--serif); font-size:19px; font-weight:600}
.wx span{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600}
.wx .dot{width:4px; height:4px; border-radius:50%; background:var(--line); flex:none}
.cities,.months{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.cities::-webkit-scrollbar,.months::-webkit-scrollbar{display:none}
.cities{margin-bottom:12px}
.months{margin-bottom:14px; flex-wrap:wrap}
.sug{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:26px}
@media(min-width:820px){ .sug{grid-template-columns:repeat(3,1fr); gap:16px; max-width:760px} }
.mesnota{font-size:11.5px; line-height:1.5; color:var(--muted); margin:0 0 14px}
.days{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:30px}
@media(min-width:560px){ .days{grid-template-columns:repeat(4,1fr)} }
@media(min-width:900px){ .days{grid-template-columns:repeat(7,1fr); gap:12px} }
.dy{background:var(--card); border-radius:10px; padding:8px 5px 9px; display:flex; flex-direction:column;
    align-items:center; gap:2px; text-align:center; transition:transform .15s, box-shadow .15s}
.dy:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(60,50,35,.13)}
.dy.hoy{outline:2px solid var(--wk,var(--accent)); outline-offset:-2px}
.dy.wknd{background:var(--paper)}
.dy .dw{font-size:8px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:700}
.dy .num{font-family:var(--serif); font-size:15px; line-height:1.05; color:var(--ink)}
.dy img{height:64px; width:auto; max-width:100%; object-fit:contain; margin:3px 0 1px}
@media(min-width:900px){ .dy img{height:92px} }
.dy .tt{font-size:9.5px; line-height:1.22; color:var(--muted)}
footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.6}
</style>
</head><body>

let fBook='Todos', fTipo='Todos', fColor='Todos', shown=24;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DOW3 = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const HOY = new Date();
const ISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HOYISO = ISO(HOY);
const YEAR = 2026;

const CIUDADES = [
  ['Ciudad de México', 19.4326, -99.1332],
  ['Querétaro',        20.5888, -100.3899],
  ['Nueva York',       40.7128,  -74.0060],
  ['Madrid',           40.4168,   -3.7038],
  ['Las Vegas',        36.1699, -115.1398],
  ['Vail',             39.6403, -106.3742],
  ['Miami',            25.7617,  -80.1918]
];
const CASA = 0;   // ciudad base: el plan del año está pensado para aquí
let ciudad = 0;
try { const g = localStorage.getItem('gw-ciudad'); if (g !== null) ciudad = +g; } catch(e){}

let mesVista = (HOY.getFullYear() === YEAR) ? HOY.getMonth() + 1 : 1;

function ficha(x, nota){
  return '<a class="cell" href="'+x.file+'#w'+x.w+'d'+x.d+'">'
    + '<img src="'+x.img+'" alt="" loading="lazy">'
    + '<span class="ct">'+esc(x.title)+'</span>'
    + '<span class="cd">'+esc(nota||x.book)+'</span></a>';
}

function encaja(o, tmin, tmax, lluvia){
  let p = 0;
  if (tmax > o.tmax) p += (tmax - o.tmax) * 1.4;
  if (tmin < o.tmin) p += (o.tmin - tmin) * 0.8;
  if (lluvia >= 55){ if (o.rain === 'evitar') p += 6; if (o.rain === 'apto') p -= 3; }
  if (o.when === 'noche') p += 4;
  return p;
}

/* ---------- calendario navegable ---------- */
function pintarMeses(){
  document.getElementById('months').innerHTML = MES3.map((m,i) =>
    '<button class="fchip '+((i+1)===mesVista?'on':'')+'" data-mes="'+(i+1)+'">'+m+'</button>').join('');
  const dim = new Date(YEAR, mesVista, 0).getDate();
  const libros = SHELF.filter(b => (b.months||[]).includes(mesVista) && b.role === 'temporada');
  document.getElementById('mesnota').textContent =
    MES[mesVista-1].charAt(0).toUpperCase() + MES[mesVista-1].slice(1) + ' · '
    + (libros.length ? libros.map(b => b.title).join(' · ') : 'sin catálogo de temporada');
  let h = '';
  for (let n = 1; n <= dim; n++){
    const key = YEAR+'-'+String(mesVista).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const p = PLAN[key];
    if (!p) continue;
    const wd = new Date(YEAR, mesVista-1, n).getDay();
    h += '<a class="dy '+(wd===0||wd===6?'wknd':'')+' '+(key===HOYISO?'hoy':'')+'"'
       + ' href="'+p.f+'#w'+p.w+'d'+p.d+'">'
       + '<span class="dw">'+DOW3[wd]+'</span><span class="num">'+n+'</span>'
       + '<img src="'+p.i+'" alt="" loading="lazy">'
       + '<span class="tt">'+esc(p.t)+'</span></a>';
  }
  document.getElementById('days').innerHTML = h;
}
document.getElementById('months').addEventListener('click', e => {
  const b = e.target.closest('[data-mes]'); if(!b) return;
  mesVista = +b.dataset.mes; pintarMeses();
});

/* ---------- hoy: ciudad, clima y tres propuestas ---------- */
function pintarHoy(wx){
  const fecha = HOY.getDate() + ' de ' + MES[HOY.getMonth()];
  let h = '<div class="cities">' + CIUDADES.map((c,i) =>
      '<button class="fchip '+(i===ciudad?'on':'')+'" data-ciudad="'+i+'">'+esc(c[0])+'</button>').join('')
    + '</div>';

  h += '<div class="wx"><b>' + (wx ? Math.round(wx.tmax)+'° / '+Math.round(wx.tmin)+'°' : esc(fecha)) + '</b>';
  if (wx){
    h += '<span class="dot"></span><span>' + esc(fecha) + '</span>'
       + '<span class="dot"></span><span>' + (wx.lluvia >= 55 ? 'lluvia probable '+wx.lluvia+'%'
           : wx.lluvia >= 25 ? 'algo de lluvia '+wx.lluvia+'%' : 'sin lluvia') + '</span>';
  } else if (wx === false) {
    h += '<span class="dot"></span><span>sin datos de clima</span>';
  } else {
    h += '<span class="dot"></span><span>consultando clima…</span>';
  }
  h += '<span class="dot"></span><span>'+esc(CIUDADES[ciudad][0])+'</span></div>';

  const p = PLAN[HOYISO];
  if (p){
    h += '<a class="hero" href="'+p.f+'#w'+p.w+'d'+p.d+'">'
      + '<img src="'+p.i+'" alt="">'
      + '<div><div class="k">'+(ciudad === CASA ? 'Le toca hoy' : 'Del calendario')+'</div><h2>'+esc(p.t)+'</h2>'
      + '<p>'+esc(p.b)+' · '+esc(p.k)+'<br>'+esc(p.a+'–'+p.z+'°')+'</p></div>'
      + '<span class="go">&#8250;</span></a>';
  }

  const mesActual = (HOY.getFullYear() === YEAR) ? HOY.getMonth()+1 : mesVista;
  const fuera = ciudad !== CASA;
  const ocasion = new Set(SHELF.filter(b => b.role === 'ocasión').map(b => b.file));
  let pool;
  if (fuera){
    /* de viaje el calendario no aplica: manda el clima, y entran los catálogos de viaje */
    pool = ALL.filter(x => !ocasion.has(x.file));
  } else {
    const enTemp = new Set(SHELF.filter(b => (b.months||[]).includes(mesActual)).map(b => b.file));
    pool = ALL.filter(x => enTemp.has(x.file) && !ocasion.has(x.file));
  }
  pool = pool.filter(x => x.when !== 'noche');
  if (!pool.length) pool = ALL.slice();
  if (p) pool = pool.filter(x => !(x.file === p.f && x.w === p.w && x.d === p.d));
  let orden;
  if (wx){
    orden = pool.map(x => ({x, p: encaja(x, wx.tmin, wx.tmax, wx.lluvia)}))
                .sort((a,b) => a.p - b.p).map(o => o.x);
  } else {
    orden = pool.slice();
  }
  const vistos = new Set(); const tres = [];
  for (const x of orden){
    if (vistos.has(x.book)) continue;
    vistos.add(x.book); tres.push(x);
    if (tres.length === 3) break;
  }
  for (const x of orden){
    if (tres.length === 3) break;
    if (!tres.includes(x)) tres.push(x);
  }
  pool = tres;
  h += '<p class="seclabel" style="margin-top:22px">'
     + (wx ? 'Tres opciones para ' + esc(CIUDADES[ciudad][0]) + ' hoy'
           : (fuera ? 'Tres opciones para ' + esc(CIUDADES[ciudad][0]) : 'Tres opciones de temporada')) + '</p>'
     + '<div class="sug">' + pool.map(x => ficha(x, x.book+' · '+x.tmin+'–'+x.tmax+'°')).join('') + '</div>';

  $('#hoy').innerHTML = h;
}

let ultimoWx = null;
function traerClima(){
  const c = CIUDADES[ciudad];
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+c[1]+'&longitude='+c[2]
        + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
        + '&timezone=auto&forecast_days=1')
    .then(r => r.json())
    .then(j => {
      const d = j.daily;
      ultimoWx = {tmax: d.temperature_2m_max[0], tmin: d.temperature_2m_min[0],
                  lluvia: d.precipitation_probability_max[0] ?? 0};
      pintarHoy(ultimoWx);
    })
    .catch(() => pintarHoy(false));
}

$('#hoy').addEventListener('click', e => {
  const b = e.target.closest('[data-ciudad]'); if(!b) return;
  ciudad = +b.dataset.ciudad;
  try { localStorage.setItem('gw-ciudad', ciudad); } catch(err){}
  pintarHoy(null); traerClima();
});

pintarMeses();
pintarHoy(null);
traerClima();

$('#shelf').innerHTML = SHELF.map(b =>
  '<a class="bcard" href="'+b.file+'">'
  + '<span class="figs">'+b.figs.map(f=>'<img src="'+f+'" alt="">').join('')+'</span>'
  + '<span><strong>'+esc(b.title)+'</strong><small>'+esc(b.subtitle)+' · 28 outfits</small></span>'
  + '<span class="sw">'+b.palette.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span></a>').join('');

function facet(vals, cur, attr){
  return '<div class="facet">'+vals.map(v =>
    '<button class="fchip '+(v===cur?'on':'')+'" data-f="'+attr+'" data-v="'+esc(v)+'">'+esc(v)+'</button>').join('')+'</div>';
}
function renderGal(){
  const list = ALL.filter(x =>
    (fBook==='Todos' || x.book===fBook) &&
    (fTipo==='Todos' || x.kind===fTipo) &&
    (fColor==='Todos' || x.fam===fColor));
  const books = ['Todos'].concat(SHELF.map(b=>b.title.split(' ')[0].replace('/','')));
  $('#gal').innerHTML = '<div class="facets">'
    + facet(books, fBook, 'book')
    + facet(['Todos','Formal','Traje','Abrigo','Separados','Deporte','Casual'], fTipo, 'tipo')
    + facet(['Todos','Azul','Gris','Negro','Verde','Marrón','Neutro'], fColor, 'color')
    + '</div><div class="galcount">'+list.length+' outfit'+(list.length===1?'':'s')+'</div>'
    + (list.length
        ? '<div class="grid">'+list.slice(0,shown).map(x =>
            '<a class="cell" href="'+x.file+'#w'+x.w+'d'+x.d+'">'
            + '<img src="'+x.img+'" alt="" loading="lazy">'
            + '<span class="ct">'+esc(x.title)+'</span>'
            + '<span class="cd">'+esc(x.date ? x.dow.slice(0,3)+' '+x.date+' '+x.mon.slice(0,3) : x.book+' · '+x.wl)+'</span>'
            + '</a>').join('')+'</div>'
          + (list.length>shown ? '<button class="more" id="moreBtn">Ver más ('+(list.length-shown)+')</button>' : '')
        : '<div class="empty">Ningún outfit con esa combinación de filtros.</div>');
}
$('#gal').addEventListener('click', e => {
  if(e.target.id === 'moreBtn'){ shown += 36; renderGal(); return; }
  const f = e.target.closest('.fchip');
  if(!f) return;
  if(f.dataset.f==='book') fBook=f.dataset.v;
  if(f.dataset.f==='tipo') fTipo=f.dataset.v;
  if(f.dataset.f==='color') fColor=f.dataset.v;
  shown = 24; renderGal();
});
renderGal();
$('#foot').textContent = 'Los nueve archivos HTML y las imágenes viven en la misma carpeta. Cada catálogo abre también por su cuenta.';
</script></body></html>
